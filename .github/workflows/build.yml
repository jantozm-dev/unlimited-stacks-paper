name: Build Plugin JAR

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: higher-stacks---paper-plugin
        run: bun install --frozen-lockfile

      - name: Build application
        working-directory: higher-stacks---paper-plugin
        run: bun run build

      - name: Create JAR in repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -f higher-stacks-paper-plugin.jar
          jar --create \
            --file higher-stacks-paper-plugin.jar \
            -C higher-stacks---paper-plugin/dist .
          test -s higher-stacks-paper-plugin.jar
          ls -lh higher-stacks-paper-plugin.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: higher-stacks-paper-plugin
          path: higher-stacks-paper-plugin.jar
          if-no-files-found: error
