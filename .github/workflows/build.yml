name: Build Paper Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Sucht automatisch nach der pom.xml (egal in welchem Ordner)
      - name: Locate pom.xml directory
        id: locate-pom
        run: |
          POM_PATH=$(find . -maxdepth 3 -name "pom.xml" -not -path "*/.*" | head -n 1)
          if [ -z "$POM_PATH" ]; then
            echo "ERROR: Could not find pom.xml in repository!"
            find . -maxdepth 3
            exit 1
          fi
          PROJECT_DIR=$(dirname "$POM_PATH")
          echo "Found pom.xml at: $POM_PATH (Directory: $PROJECT_DIR)"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "pom_path=$POM_PATH" >> $GITHUB_OUTPUT

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: ${{ steps.locate-pom.outputs.pom_path }}

      - name: Build with Maven
        working-directory: ${{ steps.locate-pom.outputs.project_dir }}
        run: mvn clean package -B

      - name: Upload compiled JAR as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HigherStacks-Plugin
          path: ${{ steps.locate-pom.outputs.project_dir }}/target/*.jar
